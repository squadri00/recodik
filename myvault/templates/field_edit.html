{% extends "base.html" %}
{% block title %}Edit field · {{ category['name'] }} · {{ app_title }}{% endblock %}
{% block content %}
<h1>Edit field — {{ category['name'] }}</h1>

<div class="card" style="max-width:560px">
  <form method="post" action="{{ url_for('categories.field_update', category_id=category['id'], field_id=field['id']) }}"
        data-field-form>
    <label>Label
      <input type="text" name="label" value="{{ field['label'] }}" required maxlength="80" autofocus>
    </label>
    <label>Machine key <span class="hint">Fixed after creation — record data is stored under this key.</span>
      <input type="text" value="{{ field['field_key'] }}" readonly>
    </label>
    <label>Type
      <select name="field_type" data-field-type>
        {% for key, meta in field_types.items() %}
          <option value="{{ key }}" data-options="{{ 1 if meta['options'] else 0 }}"
                  data-target="{{ 1 if meta['target'] else 0 }}"
                  data-alert="{{ 1 if meta['alert'] else 0 }}"
                  data-frequency="{{ 1 if meta['frequency'] else 0 }}"
                  {{ 'selected' if key == field['field_type'] }}>{{ meta['label'] }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="check">
      <input type="checkbox" name="required" value="1" {{ 'checked' if field['required'] }}> Required
    </label>
    <label data-options-wrap {{ 'hidden' if not (field['field_type'] in field_types and field_types[field['field_type']]['options']) }}>
      Options <span class="hint">One per line.</span>
      <textarea name="options" rows="4">{{ options_text }}</textarea>
    </label>
    <label data-target-wrap {{ 'hidden' if not (field['field_type'] in field_types and field_types[field['field_type']]['target']) }}>
      Target category
      <span class="hint">Each record links to one record in this category.</span>
      <select name="target_category_id">
        <option value="">— choose a category —</option>
        {% for c in all_categories %}
          <option value="{{ c['id'] }}" {{ 'selected' if c['id'] == current_target }}>{{ c['name'] }}</option>
        {% endfor %}
      </select>
    </label>
    <label data-alert-wrap {{ 'hidden' if not (field['field_type'] in field_types and field_types[field['field_type']]['alert']) }}>
      Remind me this many days before
      <span class="hint">The header alert appears once the date is this close (or past). 0 = only once overdue.</span>
      <input type="number" name="alert_days_before" min="0" step="1" value="{{ current_alert_days }}">
    </label>
    <label data-frequency-wrap {{ 'hidden' if not (field['field_type'] in field_types and field_types[field['field_type']]['frequency']) }}>
      Billing frequency
      <span class="hint">How each record's amount is billed — rolled up on the Costs dashboard.</span>
      <select name="frequency">
        <option value="monthly" {{ 'selected' if current_frequency == 'monthly' }}>Monthly</option>
        <option value="yearly" {{ 'selected' if current_frequency == 'yearly' }}>Yearly</option>
        <option value="one_time" {{ 'selected' if current_frequency == 'one_time' }}>One-time</option>
      </select>
    </label>
    {% if can_encrypt %}
      <label class="check" data-encrypt-wrap hidden>
        <input type="checkbox" name="encrypt_existing" value="1" checked>
        Encrypt this field's existing values now (requires {{ app_title }} unlocked)
      </label>
    {% endif %}
    <button class="btn btn-primary" type="submit">Save field</button>
    <a class="btn btn-ghost" href="{{ url_for('categories.edit', category_id=category['id']) }}">Cancel</a>
  </form>
</div>
{% endblock %}
