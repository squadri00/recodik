{% extends "base.html" %}
{% block title %}Sign in · {{ app_title }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1 style="display:flex;align-items:center;gap:.5rem">
    <img src="{{ url_for('static', filename='recodik-logo.png') }}" alt="" class="brand-logo" style="height:28px">
    {{ app_title }}
  </h1>
  <p class="muted">Sign in to {{ app_title }}.</p>
  <form method="post" autocomplete="off">
    <label>Username
      <input type="text" name="username" value="{{ username }}" required autofocus
             autocapitalize="none" spellcheck="false">
    </label>
    <label>Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button class="btn btn-primary" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
